<!DOCTYPE html>
<html>
<head>
  <title>Test Login Firebase</title>
</head>
<body>
  <h2>Test Login</h2>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
  <div id="result"></div>

  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"></script>
  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyDdvX1FdRwlqAhbYE7_SpzEn2lsnYW1zH4",
  authDomain: "apk-simpel-demo.firebaseapp.com",
  projectId: "apk-simpel-demo",
  storageBucket: "apk-simpel-demo.firebasestorage.app",
  messagingSenderId: "539397750231",
  appId: "1:539397750231:web:4f5f093f82135378ffdf92"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const result = document.getElementById('result');

      auth.signInWithEmailAndPassword(email, pass)
        .then(userCredential => {
          result.innerHTML = `<span style="color:green;">Login Berhasil! User: ${userCredential.user.email}</span>`;
        })
        .catch(error => {
          result.innerHTML = `<span style="color:red;">Error: ${error.code} - ${error.message}</span>`;
        });
    }
  </script>
</body>
</html>
